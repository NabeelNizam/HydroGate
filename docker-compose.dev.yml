services:
  hydrogate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: hydrogate-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
      NEXT_TELEMETRY_DISABLED: "1"
    command: npm run dev -- -H 0.0.0.0
